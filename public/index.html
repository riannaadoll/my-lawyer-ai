<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Advocate — Mening advokatim</title>
  <meta name="theme-color" content="#442104">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Chap panel: odatda yopiq. Matnlar data-i18n orqali tanlangan tilda to'ldiriladi (i18n.js) -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand"><img src="/icons/logo-mark.png" alt="" width="30" height="30"><span>AI Advocate</span></div>
      <button class="icon-btn" id="closeSide" data-i18n-title="closeSide"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
    </div>
    <button id="newChat" class="btn-new" data-i18n="newChat"></button>
    <input id="search" class="search" type="search" data-i18n-ph="search" autocomplete="off">
    <ul id="chatList"></ul>
    <div class="profile">
      <div id="pop" class="pop" hidden>
        <label><span data-i18n="name"></span><input id="nameInput" maxlength="30" data-i18n-ph="namePh"></label>
        <label><span data-i18n="lang"></span>
          <select id="langSelect"><option value="uz">O'zbekcha</option><option value="ru">Русский</option><option value="en">English</option></select>
        </label>
        <button id="clearAll" data-i18n="clearAll"></button>
      </div>
      <button id="profileBtn" class="profile-btn"><span class="avatar" id="avatar">M</span><span id="profileName"></span></button>
    </div>
  </aside>
  <div id="backdrop"></div>

  <!-- "is-empty" klassi chat bo'sh paytda input'ni ekran o'rtasiga qo'yadi -->
  <main id="chat" class="is-empty">
    <header class="topbar">
      <button class="icon-btn" id="menu" data-i18n-title="openSide"><svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
      <span class="title">AI Advocate</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="topSearch" data-i18n-title="topSearch"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="icon-btn" id="topNew" data-i18n-title="topNew"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
    </header>
    <section class="hero"><h1><span id="hello"></span><span class="sub" data-i18n="sub"></span></h1></section>
    <section id="messages" class="messages" aria-live="polite"></section>
    <div class="composer">
      <p id="status"></p>
      <div class="preview" id="preview" hidden>
        <img id="previewImg" alt="">
        <button class="icon-btn" id="removeImage" data-i18n-title="removeImage"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="box">
        <button class="icon-btn attach-btn" id="attachBtn" data-i18n-title="attach"><svg class="ico" viewBox="0 0 24 24"><path d="M8 12.5l6.5-6.5a3.5 3.5 0 015 5L11 19.5a5.5 5.5 0 01-8-8L12 2.5"/></svg></button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <textarea id="input" rows="1" maxlength="1500"></textarea>
        <button id="send" aria-label="Send">➤</button>
      </div>
    </div>
    <!-- Bo'sh chatda input tagida katta qatorlar -->
    <section class="faq" id="faq">
      <button class="faq-row" id="caseBtn"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span><b data-i18n="caseTitle"></b> <em data-i18n="caseSub"></em></span></button>
      <button class="faq-row faq-q" data-key="q1"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg><span data-i18n="q1"></span></button>
      <button class="faq-row faq-q" data-key="q2"><svg class="ico" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 016 0"/></svg><span data-i18n="q2"></span></button>
      <button class="faq-row faq-q" data-key="q3"><svg class="ico" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg><span data-i18n="q3"></span></button>
    </section>
    <!-- Eng pastda, barcha AI chatbotlardagi kabi -->
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
