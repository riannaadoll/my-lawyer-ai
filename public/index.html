<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Advocate — Mening advokatim</title>
  <meta name="theme-color" content="#1800ad">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><img src="/icons/logo-mark.png" alt="" width="34" height="34"><span>AI Advocate</span></div>
    <button id="newChat" class="btn-new">+ Yangi chat</button>
    <ul id="chatList"></ul>
  </aside>
  <div id="backdrop"></div>

  <!-- "is-empty" klassi chat bo'sh paytda input'ni ekran o'rtasiga qo'yadi -->
  <main id="chat" class="is-empty">
    <header class="topbar">
      <button id="menu" aria-label="Menyu">☰</button><span>AI Advocate</span>
    </header>
    <section class="hero">
      <img src="/icons/logo-mark.png" alt="AI Advocate" width="88" height="88">
      <h1>Mening advokatim</h1>
      <p>Huquqiy savolingizni yozing</p>
    </section>
    <section id="messages" class="messages" aria-live="polite"></section>
    <div class="composer">
      <p id="status"></p>
      <div class="box">
        <textarea id="input" rows="1" maxlength="1500" placeholder="Savolingizni yozing…"></textarea>
        <button id="send" aria-label="Yuborish">➤</button>
      </div>
      <small>Bu ma'lumot, yuridik maslahat emas.</small>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
